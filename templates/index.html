<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #eef2ff 0%, #f6f7fb 50%, #eafaf1 100%);
    font-family: 'Inter', Arial, sans-serif;
    color: #26292f;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    border-radius: 14px;
    padding: 32px 34px;
    box-shadow: 0 1px 2px rgba(20, 25, 40, 0.05), 0 10px 26px rgba(20, 25, 40, 0.07);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    font-weight: 700;
    color: #1c1f26;
  }

  .subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    line-height: 1.55;
    color: #666d7a;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
    color: #454b57;
  }

  textarea {
    width: 100%;
    min-height: 112px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    border: 1.5px solid #e2e5ec;
    border-radius: 8px;
    resize: vertical;
    background: #fbfbfd;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea:focus {
    outline: none;
    border-color: #5b6bd6;
    box-shadow: 0 0 0 3px rgba(91, 107, 214, 0.14);
    background: #fff;
  }

  .action-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    background: #4a58c9;
    color: #fff;
    border: none;
    padding: 11px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: #3d4ab8; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: default; }

  .note {
    font-size: 12px;
    color: #97a0ab;
  }

  .error {
    color: #c23b2f;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  .result {
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1.5px solid #eee;
    display: none;
  }
  .result.show { display: block; }
  .result.positive { background: #f0faf3; border-color: #cdeed8; }
  .result.negative { background: #fdf1f0; border-color: #f4d3cf; }

  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sentiment {
    font-weight: 700;
    font-size: 15px;
  }
  .positive .sentiment { color: #1e8a45; }
  .negative .sentiment { color: #c23b2f; }

  .conf-text {
    font-size: 12px;
    color: #6b7280;
  }

  .bar-bg {
    margin-top: 10px;
    height: 7px;
    background: rgba(0,0,0,0.06);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .positive .bar-fill { background: #2e9e4f; }
  .negative .bar-fill { background: #d1453b; }
</style>
</head>
<body>
  <div class="card">
    <h1>ReviewSense</h1>
    <p class="subtitle">Paste a product, movie, or service review below and it'll tell you if it reads as positive or negative (TF-IDF + Logistic Regression model, no external API used).</p>

    <label for="text">Review text</label>
    <textarea id="text">The battery life on this phone is incredible and the camera blew me away.</textarea>

    <div class="action-row">
      <button id="analyzeBtn" onclick="analyze()">Analyze</button>
      <span class="note">Runs the model that's deployed with this app - nothing gets sent anywhere else.</span>
    </div>
    <p class="error" id="errorMsg"></p>

    <div class="result" id="result">
      <div class="label-row">
        <span class="sentiment" id="sentimentLabel">-</span>
        <span class="conf-text">Confidence: <span id="confVal">0%</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </div>

<script>
async function analyze() {
  const text = document.getElementById('text').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const errEl = document.getElementById('errorMsg');
  const resultEl = document.getElementById('result');

  errEl.style.display = 'none';

  if (!text) {
    errEl.textContent = 'Type something in first.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Analyzing...';

  try {
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    resultEl.classList.remove('positive', 'negative', 'show');
    resultEl.classList.add(data.label, 'show');

    document.getElementById('sentimentLabel').textContent =
      data.label === 'positive' ? 'Positive' : 'Negative';

    const pct = Math.round(data.confidence * 100);
    document.getElementById('confVal').textContent = pct + '%';
    document.getElementById('barFill').style.width = pct + '%';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze';
  }
}
</script>
</body>
</html>
