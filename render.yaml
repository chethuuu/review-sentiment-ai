# Render blueprint, not actually used for the live deployment (that's on
# PythonAnywhere) - kept from when I was testing a Docker-based deploy option.
# In Render dashboard: New -> Blueprint -> point at this repo.
services:
  - type: web
    name: reviewsense
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
    healthCheckPath: /api/health
